<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Assistant" />
  <meta name="description" content="A personal AI assistant powered by Claude" />
  <link rel="manifest" href="./manifest.json" />
  <title>AI Assistant</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #7c3aed;
      --purple-light: #a78bfa;
      --purple-dim: rgba(124,58,237,0.2);
      --bg: #09060f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #f3f0ff;
      --text-muted: #7c6e9a;
      --green: #34d399;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      border-bottom: 1px solid var(--border);
      background: rgba(9,6,15,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex-shrink: 0;
      z-index: 10;
    }

    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 18px rgba(124,58,237,0.5);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-family: 'Syne', sans-serif;
      font-size: 17px; font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 12px;
      color: var(--purple-light);
      margin-top: 1px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      margin-left: auto;
    }

    /* Install banner */
    #install-banner {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: rgba(124,58,237,0.12);
      border-bottom: 1px solid rgba(124,58,237,0.25);
      font-size: 13px;
      color: var(--purple-light);
    }

    #install-banner.visible { display: flex; }

    #install-btn {
      margin-left: auto;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--purple);
      background: var(--purple-dim);
      color: var(--purple-light);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 4px; }

    /* Empty state */
    #empty-state {
      text-align: center;
      padding-top: 40px;
    }

    #empty-state h2 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #f3f0ff, var(--purple-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    #empty-state p { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 420px;
      margin: 0 auto;
    }

    .suggestion-chip {
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid rgba(124,58,237,0.2);
      border-radius: 14px;
      color: var(--purple-light);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }

    .suggestion-chip:active { transform: scale(0.97); }
    .suggestion-chip:hover {
      background: rgba(124,58,237,0.12);
      border-color: rgba(124,58,237,0.45);
    }

    /* Message bubbles */
    .message-row {
      display: flex;
      margin-bottom: 16px;
      animation: fadeUp 0.28s ease both;
    }

    .message-row.user { justify-content: flex-end; }
    .message-row.assistant { justify-content: flex-start; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      margin-right: 10px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      font-size: 14.5px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-row.user .bubble {
      background: linear-gradient(135deg, var(--purple), #6d28d9);
      border-radius: 18px 18px 4px 18px;
      color: #f3f0ff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.3);
    }

    .message-row.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      color: #e9e4f7;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    /* Typing dots */
    .typing-bubble {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      align-items: center;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--purple-light);
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* ── Input area ── */
    #input-area {
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: rgba(9,6,15,0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(124,58,237,0.28);
      border-radius: 16px;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: rgba(124,58,237,0.65);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      padding: 5px 0;
    }

    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 40px; height: 40px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(124,58,237,0.4);
    }

    #send-btn:disabled {
      background: var(--purple-dim);
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.5;
    }

    #send-btn:not(:disabled):active { transform: scale(0.93); }

    .hint {
      text-align: center;
      font-size: 11px;
      color: #3d3459;
      margin-top: 8px;
    }

    .error-msg {
      text-align: center;
      color: #f87171;
      font-size: 13px;
      padding: 8px 0 0;
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

<div id="app">
  <header>
    <div class="avatar">✦</div>
    <div class="header-text">
      <h1>AI Assistant</h1>
      <p>Powered by Claude · Always ready</p>
    </div>
    <div class="status-dot"></div>
  </header>

  <div id="install-banner">
    📲 Install this app for quick access anytime
    <button id="install-btn">Install</button>
  </div>

  <div id="messages">
    <div id="empty-state">
      <h2>How can I help?</h2>
      <p>Ask me anything — I'm here to assist.</p>
      <div class="suggestions">
        <button class="suggestion-chip" onclick="fillInput(this)">Explain quantum computing simply</button>
        <button class="suggestion-chip" onclick="fillInput(this)">Write a Python hello world</button>
        <button class="suggestion-chip" onclick="fillInput(this)">What's the meaning of life?</button>
        <button class="suggestion-chip" onclick="fillInput(this)">Give me 3 productivity tips</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-row">
      <textarea id="user-input" placeholder="Message the assistant…" rows="1"></textarea>
      <button id="send-btn" disabled onclick="sendMessage()">↑</button>
    </div>
    <p class="hint">Enter to send · Shift+Enter for new line</p>
    <p class="error-msg" id="error-msg"></p>
  </div>
</div>

<script>
  // ── State ──
  const SYSTEM_PROMPT = `You are a helpful, concise, and friendly AI assistant. Answer questions clearly and directly. You can use markdown-style formatting in plain text when helpful. Keep responses focused and useful.`;
  let conversationHistory = [];
  let isLoading = false;

  // ── DOM refs ──
  const messagesEl  = document.getElementById("messages");
  const emptyState  = document.getElementById("empty-state");
  const inputEl     = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");
  const errorMsg    = document.getElementById("error-msg");

  // ── Input handling ──
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    sendBtn.disabled = !inputEl.value.trim() || isLoading;
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  function fillInput(btn) {
    inputEl.value = btn.textContent;
    inputEl.dispatchEvent(new Event("input"));
    inputEl.focus();
  }

  // ── Render helpers ──
  function appendMessage(role, content) {
    if (emptyState) emptyState.remove();

    const row = document.createElement("div");
    row.className = `message-row ${role}`;

    if (role === "assistant") {
      const av = document.createElement("div");
      av.className = "msg-avatar";
      av.textContent = "✦";
      row.appendChild(av);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = content;
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function showTyping() {
    const row = document.createElement("div");
    row.className = "message-row assistant";
    row.id = "typing-row";

    const av = document.createElement("div");
    av.className = "msg-avatar";
    av.textContent = "✦";
    row.appendChild(av);

    const tb = document.createElement("div");
    tb.className = "typing-bubble";
    tb.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    row.appendChild(tb);

    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById("typing-row");
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── API call ──
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    errorMsg.textContent = "";
    inputEl.value = "";
    inputEl.style.height = "auto";

    conversationHistory.push({ role: "user", content: text });
    appendMessage("user", text);
    showTyping();

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: conversationHistory,
        }),
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);

      const reply = data.content
        .filter(b => b.type === "text")
        .map(b => b.text)
        .join("\n");

      conversationHistory.push({ role: "assistant", content: reply });
      hideTyping();
      appendMessage("assistant", reply);
    } catch (err) {
      hideTyping();
      errorMsg.textContent = "Something went wrong. Please try again.";
      conversationHistory.pop(); // remove failed user message
    } finally {
      isLoading = false;
      sendBtn.disabled = !inputEl.value.trim();
      inputEl.focus();
    }
  }

  // ── PWA: Service Worker ──
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js").catch(console.warn);
  }

  // ── PWA: Install prompt ──
  let deferredPrompt;
  const banner = document.getElementById("install-banner");
  const installBtn = document.getElementById("install-btn");

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    banner.classList.add("visible");
  });

  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === "accepted") banner.classList.remove("visible");
    deferredPrompt = null;
  });

  window.addEventListener("appinstalled", () => {
    banner.classList.remove("visible");
  });
</script>
</body>
</html>
